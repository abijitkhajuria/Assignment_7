<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Match Scorecard — CricPulse</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CricPulse Design System -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-cp">
        <div class="container">
            <a class="cp-logo" href="/index.html">
                <div class="cp-logo-icon">
                    <i class="bi bi-activity"></i>
                </div>
                <span>Cric<span style="color: var(--cp-emerald);">Pulse</span></span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#cpNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="cpNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link cp-nav-link" href="/index.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cp-nav-link" href="/match-live.html"><i class="bi bi-broadcast me-1 text-danger"></i> Live Match</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cp-nav-link" href="/results.html"><i class="bi bi-trophy me-1"></i> Results</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cp-nav-link" href="/players.html"><i class="bi bi-people me-1"></i> Players & Stats</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cp-nav-link" href="/admin.html"><i class="bi bi-shield-lock me-1"></i> Admin Console</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a id="btnBackToLive" href="/match-live.html" class="btn btn-sm btn-cp-primary">
                        <i class="bi bi-broadcast me-1"></i> Live Center
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4">

        <!-- Match Summary Card -->
        <div class="cp-card cp-card-featured mb-4" id="scorecardSummaryCard">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                <span class="badge-format" id="scFormat">T20</span>
                <span class="text-secondary small" id="scVenue"><i class="bi bi-geo-alt me-1"></i>Venue</span>
            </div>
            <h1 class="h4 text-white mb-2" id="scTitle">Loading Match Scorecard...</h1>
            <p class="text-cyan small mb-2" id="scToss">Toss info</p>
            <div class="p-2 rounded bg-dark border border-secondary border-opacity-50 text-warning fw-semibold mb-2" id="scResultMargin">
                Match Result
            </div>
            <div id="scPlayerOfMatch" class="text-secondary small"></div>
        </div>

        <!-- Innings Tabs -->
        <ul class="nav nav-tabs cp-tabs mb-4 border-secondary border-opacity-25" id="inningsTabs">
            <!-- Tabs injected dynamically -->
        </ul>

        <!-- Innings Tab Contents -->
        <div id="inningsContentContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-info" role="status"></div>
                <p class="text-secondary small mt-2">Loading full scorecard details...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer-cp">
        <div class="container text-center">
            <p class="text-secondary small mb-0">CricPulse — Live Cricket Score Management System</p>
        </div>
    </footer>

    <!-- Bootstrap & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/scorecard.js"></script>
</body>
</html>
